<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arduino Experiments</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* HEADER */

        .header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .header p {
            margin: 0;
            font-size: 16px;
        }

        /* MAIN AREA */

        .container {
            width: 90%;
            max-width: 900px;
            margin: 35px auto;
        }

        .container > h2 {
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        /* EXPERIMENT CARD */

        .experiment-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .experiment-number {
            color: #2563eb;
            font-size: 15px;
            font-weight: bold;
        }

        .experiment-card h2 {
            margin: 10px 0;
            color: #111827;
        }

        .experiment-card p {
            color: #555;
            margin-bottom: 20px;
        }

        /* BUTTON */

        .open-button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .open-button:hover {
            background: #1d4ed8;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .header h1 {
                font-size: 27px;
            }

            .container {
                width: 92%;
            }

            .experiment-card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h1>Arduino Experiments</h1>

        <p>
            IoT Kit Practical Experiments
        </p>

    </div>


    <!-- MAIN CONTENT -->

    <div class="container">

        <h2>Experiment List</h2>


        <!-- EXPERIMENT 1 -->

        <div class="experiment-card">

            <div class="experiment-number">
                Arduino Experiment No. 1
            </div>

            <h2>
                LED Blinking
            </h2>

            <p>
                Basic Arduino experiment to control an LED
                using a digital output pin.
            </p>

            <a
                href="YOUR-EXPERIMENT-LINK"
                class="open-button"
            >
                Open Experiment →
            </a>

        </div>


    </div>


</body>

</html>
